<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Sistem Registrasi Sertifikasi Kampus - Platform marketplace untuk pendaftaran program sertifikasi mahasiswa" />
  <title>BLU Sertifikasi Algo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }

    .loader-bar {
      width: 150px;
      height: 4px;
      background-color: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }

    .loader-progress {
      width: 40%;
      height: 100%;
      background-color: #2563eb;
      border-radius: 999px;
      animation: progress 1.5s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes progress {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    body.loaded #initial-loader {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <img src="/logo.png" alt="Logo" class="loader-logo" />
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.body.classList.add('loaded');
      }, 500);
    });
  </script>
</body>

</html>
